<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title"><title id="title">Ekran logowania</title><style>text{font-family:Inter,'Segoe UI',Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="820" rx="0" fill="#F8FAFC" stroke="none"/><rect x="0" y="0" width="540" height="820" rx="0" fill="#4338CA" stroke="none"/><rect x="64" y="60" width="32" height="32" rx="9" fill="#4338CA" stroke="none"/><path d="M72 76l6 6 11-13" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="85" font-size="25" fill="white" font-weight="700">Zadaniowo</text><text x="64" y="305" font-size="42" fill="white" font-weight="700">Mniej chaosu.</text><text x="64" y="363" font-size="42" fill="white" font-weight="700">Więcej zrobione.</text><text x="64" y="420" font-size="20" fill="white" font-weight="400">Twoje zadania, terminy i priorytety</text><text x="64" y="454" font-size="20" fill="white" font-weight="400">w jednym uporządkowanym miejscu.</text><rect x="64" y="529" width="402" height="100" rx="16" fill="#3730A3" stroke="none"/><text x="90" y="569" font-size="20" fill="white" font-weight="600">✓  Zaplanuj dzień</text><text x="90" y="601" font-size="16" fill="white" font-weight="400">Zacznij od jednego małego kroku.</text><rect x="622" y="154" width="496" height="512" rx="18" fill="white" stroke="none"/><text x="662" y="217" font-size="30" fill="#0F172A" font-weight="700">Dobrze Cię widzieć</text><text x="662" y="251" font-size="16" fill="#475569" font-weight="400">Zaloguj się, aby wrócić do swoich zadań.</text><text x="662" y="304" font-size="14" fill="#0F172A" font-weight="600">Adres e-mail</text><rect x="662" y="316" width="416" height="46" rx="8" fill="white" stroke="#CBD5E1"/><text x="676" y="345" font-size="15" fill="#475569" font-weight="400">anna@example.com</text><text x="662" y="399" font-size="14" fill="#0F172A" font-weight="600">Hasło</text><rect x="6