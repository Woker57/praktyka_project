name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check structure
        run: |
          ls -R
          test -f .gitignore
          test -f README.md
          test -f frontend/index.html
          test -f backend/index.php
          test -f database/init.sql
