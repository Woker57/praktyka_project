name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/tasks.js
      - name: Build API
        run: dotnet build backend/TaskManager.Api/TaskManager.Api.csproj --configuration Release
      - name: Check database scripts
        run: |
          test -s database/table-schema.sql
          test -s database/seed-data.sql
          test -s database/migrate-task-details.sql
